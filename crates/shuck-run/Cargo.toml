[package]
name = "shuck-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/ewhauser/shuck"
description = "Managed shell interpreter resolution for shuck"
keywords = ["shell", "bash", "runner", "version-manager"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = { workspace = true }
etcetera = { workspace = true }
deser = { workspace = true }
deser-json = { workspace = true }
sha2 = { workspace = true }
shuck-parser = { workspace = true }
tempfile = { workspace = true }
deser-toml = { workspace = true }
deser-value = { workspace = true }

[lints.clippy]
redundant_clone = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_value = "warn"
wildcard_enum_match_arm = "warn"

[lints.rust]
unsafe_code = "warn"
