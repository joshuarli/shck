[package]
name = "shuck-benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Benchmark fixtures and harnesses for shuck"
keywords = ["benchmark"]
categories = ["development-tools::profiling"]
publish = false

[features]
large-corpus-hotspots = []
parser-benchmarking = ["shuck-parser/benchmarking"]
dhat-heap = []

[dependencies]
shuck-formatter = { workspace = true, features = ["benchmarking"] }
shuck-linter = { workspace = true, features = ["benchmarking"] }
shuck-parser = { workspace = true }

[dev-dependencies]
dhat = "0.3"
deser = { workspace = true }
deser-json = { workspace = true }
rustybench = "0.4"
shuck-cli = { workspace = true }
shuck-indexer = { workspace = true }
shuck-semantic = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
walkdir = "2"

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
tikv-jemallocator = "0.6"

[[example]]
name = "parser_counts"
required-features = ["parser-benchmarking"]

[[example]]
name = "large_corpus_profile"
required-features = ["large-corpus-hotspots"]

[[bench]]
name = "lexer"
harness = false

[[bench]]
name = "lexer_hot_path"
harness = false

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "indexer"
harness = false

[[bench]]
name = "arithmetic"
harness = false

[[bench]]
name = "semantic"
harness = false

[[bench]]
name = "editor"
harness = false

[[bench]]
name = "unused_assignment"
harness = false

[[bench]]
name = "linter"
harness = false

[[bench]]
name = "formatter"
harness = false

[[bench]]
name = "check_command"
harness = false

[[bench]]
name = "large_corpus_hotspots"
harness = false
required-features = ["large-corpus-hotspots"]

[[bench]]
name = "case_patterns"
harness = false

[lints.clippy]
redundant_clone = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
match_wildcard_for_single_variants = "warn"
needless_pass_by_value = "warn"
wildcard_enum_match_arm = "warn"
