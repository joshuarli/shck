# shuck

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.metadata.cargo-shear]
ignored = ["shuck-benchmark"]

[workspace.package]
version = "0.2.8"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
authors = ["Eric Hauser"]
repository = "https://github.com/ewhauser/shuck"
description = "A fast shell script linter"
keywords = ["shell", "bash", "linter", "static-analysis", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Internal crates — path plus version so publishes to crates.io resolve.
# The release script bumps these in lockstep with workspace.package.version.
shuck-ast = { path = "crates/shuck-ast", version = "0.2.8" }
shuck-benchmark = { path = "crates/shuck-benchmark" }
shuck-cache = { path = "crates/shuck-cache", version = "0.2.8" }
shuck-config = { path = "crates/shuck-config", version = "0.2.8" }
shuck-discover = { path = "crates/shuck-discover", version = "0.2.8" }
shuck-formatter = { path = "crates/shuck-formatter", version = "0.2.8" }
shuck-indexer = { path = "crates/shuck-indexer", version = "0.2.8" }
shuck-linter = { path = "crates/shuck-linter", version = "0.2.8" }
shuck-parser = { path = "crates/shuck-parser", version = "0.2.8" }
shuck-run = { path = "crates/shuck-run", version = "0.2.8" }
shuck-semantic = { path = "crates/shuck-semantic", version = "0.2.8" }
shuck-cli = { path = "crates/shuck-cli", version = "0.2.8" }

# Error handling
thiserror = "2"
anyhow = "1"
etcetera = "0.8"
rayon = "1.10"
annotate-snippets = "0.10"
rustc-hash = "2.0.0"
tracing = "0.1.40"

# Serialization
deser = { version = "0.10.2", features = ["derive"] }
deser-cbor = "0.10.2"
deser-json = "0.10.2"
deser-toml = "0.10.2"
deser-value = "0.10.2"
deser-yaml = "0.10.2"
compact_str = "0.8"
smallvec = "1.15"

# Checksums
sha2 = "0.11"

# CLI
globset = "0.4"
ignore = "0.4"
lexopt = "0.3"
notify = "8.0.0"

# Serialization
similar = "2"
quick-junit = "0.6.1"

# Testing
tempfile = "3"
memchr = "2"
insta = "1.42"
test-case = "3"
roxmltree = "0.20"

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

